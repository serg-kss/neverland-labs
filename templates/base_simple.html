{% load static %}
{% load i18n %}
{% get_current_language as CURRENT_LANG %}

<!DOCTYPE html>
<html lang="{{ CURRENT_LANG }}">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description" content="{{ description|default:'Digital product development, marketing &amp; analytics.' }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neverland Labs">
  <meta property="og:title" content="{{ og_title|default:title }}">
  <meta property="og:description" content="{{ og_description|default:'' }}">
  <meta property="og:url"
        content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <meta property="og:image"
        content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/nl.png' %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title|default:title }}">
  <meta name="twitter:description" content="{{ og_description|default:description }}">
  <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/nl.png' %}">

  <title>{{ title|default:"Neverland Labs" }}</title>
  <!-- Favicons -->
  <link rel="icon" type="image/png" href="{% static 'assets/img/favicon.png' %}?v=2">
  <link rel="apple-touch-icon" href="{% static 'assets/img/apple-touch-icon.png' %}?v=2">

  {% for lang in languages %}
  <link rel="alternate"
        hreflang="{{ lang.code }}"
        href="{{ request.scheme }}://{{ request.get_host }}/{{ lang.code }}{{ request.path|slice:'3:' }}">
  {% endfor %}

  <link rel="alternate"
      hreflang="x-default"
      href="{{ request.scheme }}://{{ request.get_host }}/en{{ request.path|slice:'3:' }}">
    
  <link rel="canonical"
      href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static "assets/vendor/bootstrap/css/bootstrap.min.css" %}" rel="stylesheet">
  <link href="{% static "assets/vendor/bootstrap-icons/bootstrap-icons.css" %}" rel="stylesheet">
  <link href="{% static "assets/vendor/glightbox/css/glightbox.min.css" %}" rel="stylesheet">
  <link href="{% static "assets/vendor/swiper/swiper-bundle.min.css" %}" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="{% static "assets/css/main.css" %}" rel="stylesheet">

</head>

<body class="index-page">

  <header id="header" class="header fixed-top">

    {% include "includes/topbar.html" %}

    <div class="branding d-flex align-items-cente">

      <div class="container position-relative d-flex align-items-center justify-content-between">
        <a href="{% url 'pages:index' %}" class="logo d-flex align-items-center">
          <img src="{% static "assets/img/nl.png" %}" alt="neverlandLabs">
        </a>
      </div>

    </div>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Neverland Labs",
      "url": "{{ request.scheme }}://{{ request.get_host }}",
      "logo": "{{ request.scheme }}://{{ request.get_host }}{% static 'assets/img/nl.png' %}",
      "sameAs": [
        "https://www.linkedin.com/",
        "https://twitter.com/",
        "https://github.com/"
      ],
      "description": "{{ description }}",
      "foundingLocation": {
        "@type": "Place",
        "name": "Ukraine"
      }
    }
  </script>
  
  </header>

  <main class="main">
    {% block content %}{% endblock content %}
  </main>

  {% include "includes/footer.html" %}

  <!-- Scroll Top -->
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Preloader -->
  <div id="preloader">
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Vendor JS Files -->
  <script src="{% static "assets/vendor/bootstrap/js/bootstrap.bundle.min.js" %}"></script>
  <script src="{% static "assets/vendor/php-email-form/validate.js" %}"></script>
  <script src="{% static "assets/vendor/glightbox/js/glightbox.min.js" %}"></script>
  <script src="{% static "assets/vendor/purecounter/purecounter_vanilla.js" %}"></script>
  <script src="{% static "assets/vendor/swiper/swiper-bundle.min.js" %}"></script>
  <script src="{% static "assets/vendor/imagesloaded/imagesloaded.pkgd.min.js" %}"></script>
  <script src="{% static "assets/vendor/isotope-layout/isotope.pkgd.min.js" %}"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- Main JS File -->
  <script>
    AOS.init({
    once: true,
    offset: 120,
    duration: 700,
    easing: 'ease-out-cubic',
    disableMutationObserver: true, // важно для стабильности
   });
  </script>
  <script src="{% static "assets/js/main.js" %}"></script>

</body>

</html>
